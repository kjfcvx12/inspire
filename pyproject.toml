[project]
name = "interview"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic", "scikit-learn", "pandas", "streamlit", "fastapi", "uvicorn", "python-dotenv", "pytest",
    "ruff", "openpyxl", "plotly", "tenacity",
    # RAG 기본: kiwipiepy(한국어 형태소 검색), pypdf(PDF 로딩)
    "kiwipiepy", "pypdf",
]

[project.optional-dependencies]
# langfuse/supabase: 선택 연동, matplotlib: 정적 차트
# rank-bm25: RAG 검색 개선, lightgbm/shap: 예측 비교·설명, kiwipiepy: 한국어 형태소 분석
# torch(+vision/audio): 딥러닝(Windows PyPI wheel은 CPU 빌드), transformers/sentence-transformers: 임베딩·NLP,
# accelerate/datasets: 학습 편의·HF 데이터셋, tqdm/pillow: 진행 표시·이미지 입출력
extras = [
    "langfuse", "supabase", "matplotlib", "rank-bm25", "lightgbm", "shap",
    "torch", "torchvision", "torchaudio", "transformers", "sentence-transformers",
    "accelerate", "datasets", "tqdm", "pillow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # projects/<이름>/tests는 각 프로젝트에서 따로 실행

[tool.ruff]
line-length = 120
exclude = [".venv", "data", "logs", "projects"]

[tool.ruff.lint]
select = ["E", "F", "W"]
